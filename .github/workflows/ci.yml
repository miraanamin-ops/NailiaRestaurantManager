# Runs on every push and pull request: type-check, lint and all automated tests.
# A red ❌ on GitHub means something is broken. (Vercel also runs the tests
# before every deploy, so a failing change never goes live: see vercel.json.)
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      # Vercel's build may run the tests with TEST_MODE=true (deprecated, but still
      # read), so run them that way here too: a test that only passes with it off
      # can't pass on GitHub and then stop the deploy. The other switches are
      # cleared before every test file (tests/support/switch-env.ts).
      - name: Tests (with TEST_MODE on, as on Vercel)
        run: npm test
        env:
          TEST_MODE: "true"

  # The synthetic data generator (analytics/generator): same seed gives the same data,
  # totals reconcile, and the loader builds and loads a real Postgres with the full
  # migration chain (pgserver) and refuses production.
  generator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics/generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: analytics/generator/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Generator tests
        run: python -m pytest -q tests
