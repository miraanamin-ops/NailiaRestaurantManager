# Live agent tests: the real agents (real Claude) against the saved cases in
# agents/tests/. They cost a little each run, so they only run:
#   - on pull requests that change the agents or the agent pipeline
#   - when started by hand (Actions > Agent tests > Run workflow)
# The offline agent tests run on every push with the other tests (ci.yml).
# Needs the ANTHROPIC_API_KEY repository secret (with a spend limit on the key).
name: Agent tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agents/**"
      - "src/lib/agents/**"
      - "src/lib/checks/**"
      - "src/lib/profile/**"
      - "src/lib/send.ts"
      - "src/lib/trust.ts"
      - "src/lib/gate-rules.ts"
      - "src/lib/claude.ts"
      - "tests/agents/**"
      - "tests/agents-live/**"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live agent tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::No ANTHROPIC_API_KEY secret, so the live agent tests were skipped."
            exit 0
          fi
          npm run test:agents
