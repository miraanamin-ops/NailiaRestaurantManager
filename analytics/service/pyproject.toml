[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dinerai-analytics"
version = "0.1.0"
description = "DinerAI's analytics service: runs the statistical models from the job queue"
requires-python = ">=3.10"
# Pinned versions live in requirements.txt.
dependencies = ["psycopg[binary]>=3.2", "numpy>=1.26", "scipy>=1.11", "tzdata"]

[project.scripts]
dinerai-analytics = "dinerai_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# forecast_daily's editable defaults (the priors per restaurant type) ship with the package.
[tool.setuptools.package-data]
"dinerai_analytics.models.forecast_daily" = ["defaults/*.json"]

[tool.ruff]
line-length = 160
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a local Postgres (pgserver) with the full migration chain"]
